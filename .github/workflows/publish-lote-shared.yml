# Publica lote-shared (esqueleto CodeArtifact)
# Preencha secrets/vars: AWS_REGION, CODEARTIFACT_DOMAIN, CODEARTIFACT_REPO, role OIDC.
name: publish-lote-shared

on:
  workflow_dispatch:
  push:
    tags:
      - "lote-shared-v*"

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
